name: IDLIX · Publish verified APK

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: idlix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish latest verified signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check GitHub Actions access
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}" --jq '.full_name' >/dev/null
          echo "Using the repository-scoped GitHub Actions token."

      - name: Find the latest successful Android build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BUILDS="$(gh run list --repo "${GITHUB_REPOSITORY}" \
            --workflow android-apk.yml --branch main --limit 20 \
            --json databaseId,headSha,status,conclusion \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success")][0]')"
          if [[ -z "${BUILDS}" || "${BUILDS}" == "null" ]]; then
            echo "::error::No successful Android build was found on main."
            exit 1
          fi
          RUN_ID="$(jq -r '.databaseId' <<< "${BUILDS}")"
          BUILD_SHA="$(jq -r '.headSha' <<< "${BUILDS}")"
          CURRENT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          CHANGED_FILES="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BUILD_SHA}...${CURRENT_SHA}" --jq '.files[]?.filename' || true)"
          if grep -Eq '^(app/|gradle/|gradle.properties$|gradlew(.bat)?$|settings.gradle.kts$|build.gradle.kts$|buildSrc/|\.github/workflows/android-apk.yml$)' <<< "${CHANGED_FILES}"; then
            echo "::error::Android source changed after the successful build. Wait for the automatic build, then publish again."
            exit 1
          fi
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${BUILD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Using successful Android build ${RUN_ID} at ${BUILD_SHA}."

      - name: Download and verify the signed APK
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ steps.build.outputs.run_id }}
          BUILD_HEAD_SHA: ${{ steps.build.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          gh run download "${BUILD_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --dir artifact
          APK_PATH="$(find artifact -type f -name app-release.apk -print -quit)"
          INFO_PATH="$(find artifact -type f -name release-info.env -print -quit)"
          if [[ -z "${APK_PATH}" || -z "${INFO_PATH}" ]]; then
            echo "::error::No signed APK metadata was found. Add the existing IDLIX_SIGNING_BUNDLE secret to this repository, then run a new Android build."
            exit 1
          fi
          VERSION="$(sed -n 's/^IDLIX_RELEASE_VERSION=//p' "${INFO_PATH}" | head -n1)"
          VERSION_CODE="$(sed -n 's/^IDLIX_VERSION_CODE=//p' "${INFO_PATH}" | head -n1)"
          ARTIFACT_SHA="$(sed -n 's/^IDLIX_HEAD_SHA=//p' "${INFO_PATH}" | head -n1)"
          EXPECTED_SHA="$(sed -n 's/^APK_SHA256=//p' "${INFO_PATH}" | head -n1)"
          ACTUAL_SHA="$(sha256sum "${APK_PATH}" | awk '{print $1}')"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "${VERSION_CODE}" =~ ^[0-9]+$ ]]; then
            echo "::error::Build artifact metadata has an invalid version."
            exit 1
          fi
          if [[ "${ARTIFACT_SHA}" != "${BUILD_HEAD_SHA}" || "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::APK commit or SHA-256 does not match the verified build metadata."
            exit 1
          fi
          APK_NAME="IDLIX-${VERSION}.apk"
          cp "${APK_PATH}" "${APK_NAME}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "apk_name=${APK_NAME}" >> "${GITHUB_OUTPUT}"
          echo "build_sha=${BUILD_HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Verified IDLIX ${VERSION} (versionCode ${VERSION_CODE}, SHA-256 ${ACTUAL_SHA})."

      - name: Prepare release changelog
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.package.outputs.version_code }}
          BUILD_SHA: ${{ steps.package.outputs.build_sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          if [[ "${RELEASE_VERSION}" == "1.0.0" ]]; then
            TITLE="IDLIX 1.0.0 — Rilis awal Seri 1.0"
            cat > release-notes.md <<'NOTES'
          ## IDLIX 1.0.0 — Ringkasan fitur Seri 1.0

          APK resmi untuk Android phone, tablet, dan Android TV. Dapat dipasang di atas aplikasi IDLIX yang sudah ada untuk mempertahankan data.

          ### Tampilan di semua perangkat
          - Layout khusus untuk HP, tablet portrait/landscape, dan Android TV dengan navigasi remote.
          - Pilihan layout Otomatis, TV, atau Mobile.
          - Tema Light, Dark, OLED hitam dengan aksen merah IDLIX, dan Material You.
          - Blur ringan pada kontrol mobile di perangkat yang mendukungnya.

          ### Katalog, Jelajah, dan Pencarian
          - Baris film dan serial di Beranda, halaman Film dan Serial, serta filter Genre, Negara, Tahun, Network, dan jenis konten.
          - Grid koleksi di Pencarian, dengan pilihan Semua, Tersimpan, IDLIX, dan kurasi luar.
          - 19 koleksi rekomendasi Cinemeta untuk film, serial, rating, genre, dan judul tahun berjalan.
          - Koleksi dapat disimpan di perangkat dan dimuat bertahap dengan cache.
          - Rekomendasi luar dicocokkan berdasarkan judul, tahun, dan jenis konten sebelum membuka hasil IDLIX.
          - Poster cadangan dan pesan koneksi yang membedakan gagal memuat dari hasil kosong.

          ### Detail dan pemutaran
          - Halaman detail menampilkan poster, logo judul bila tersedia, rating, kualitas, dan informasi pemeran.
          - Pemutar video mendukung HLS, subtitle, pilihan kualitas dan rasio tampilan bila disediakan sumber.
          - Pergantian episode, riwayat tontonan, dan lanjut menonton.
          - Preferensi tema dan tontonan disimpan di perangkat.

          ### Identitas dan pembaruan
          - Ikon adaptif, themed icon, splash screen, dan banner Android TV dengan identitas IDLIX.
          - Pemeriksaan update dari GitHub Releases, validasi ukuran dan SHA-256 APK, lalu pemasangan lewat installer Android.
          - Preferensi lama dimigrasikan agar pembaruan mempertahankan pengaturan pengguna.

          *Informasi katalog, artwork, subtitle, dan kualitas bergantung pada sumber yang tersedia.*
          NOTES
          else
            TITLE="IDLIX ${RELEASE_VERSION}"
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${TAG}" \
              -f target_commitish="${BUILD_SHA}" \
              --jq '.body' > release-notes.md
            {
              echo
              echo "Install this signed APK over the existing IDLIX app to keep app data."
              echo "Package: com.idlix.tv."
            } >> release-notes.md
          fi
          printf '\n\n<!-- IDLIX_VERSION_CODE=%s -->\n' "${RELEASE_VERSION_CODE}" >> release-notes.md
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "title=${TITLE}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.notes.outputs.tag }}
          RELEASE_TITLE: ${{ steps.notes.outputs.title }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          BUILD_SHA: ${{ steps.package.outputs.build_sha }}
          APK_NAME: ${{ steps.package.outputs.apk_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TITLE}" --notes-file release-notes.md
            gh release upload "${RELEASE_TAG}" "${APK_NAME}" \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${APK_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${BUILD_SHA}" \
              --title "${RELEASE_TITLE}" \
              --notes-file release-notes.md \
              --latest
          fi
          echo "Published ${RELEASE_TAG} from verified Android build at ${BUILD_SHA}." >> "${GITHUB_STEP_SUMMARY}"
