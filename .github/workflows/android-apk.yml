name: IDLIX · Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: idlix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build dan terbitkan APK signed
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.1

      - name: Determine next release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [[ ! "$PREVIOUS_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            PREVIOUS_TAG="$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed -n 's|.*refs/tags/||p' | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' | sort -V | tail -n1 || true)"
          fi
          if [[ "$PREVIOUS_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            PREVIOUS_VERSION="$(printf "%s" "$PREVIOUS_TAG" | cut -c2-)"
            IFS=. read -r MAJOR MINOR PATCH <<< "$PREVIOUS_VERSION"
            VERSION="$MAJOR.$MINOR.$((10#$PATCH + 1))"
          elif [[ -z "$PREVIOUS_TAG" ]]; then
            VERSION="1.0.0"
          else
            echo "::error::Could not determine the latest IDLIX release version."
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          if (( MAJOR > 19 || MINOR > 99 || PATCH > 999 )); then
            echo "::error::Version outside supported range"
            exit 1
          fi
          VERSION_CODE=$((1200000 + GITHUB_RUN_NUMBER * 1000 + 10#$PATCH))
          echo "IDLIX_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "IDLIX_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Preparing IDLIX $VERSION (versionCode $VERSION_CODE)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Restore persistent release signing key
        id: signing
        env:
          IDLIX_SIGNING_BUNDLE: ${{ secrets.IDLIX_SIGNING_BUNDLE }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$IDLIX_SIGNING_BUNDLE" ]]; then
            echo "::error::Set repository Actions secret IDLIX_SIGNING_BUNDLE before releasing."
            exit 1
          fi
          python3 - <<'PY'
          import base64, json, os, pathlib, re, subprocess
          data=json.loads(base64.b64decode(os.environ["IDLIX_SIGNING_BUNDLE"].strip(), validate=True))
          alias=data["alias"]
          password=data["password"]
          if alias != "idlix" or not re.fullmatch(r"[A-Za-z0-9_-]{32,}", password):
              raise SystemExit("Unexpected signing metadata")
          keystore=pathlib.Path(os.environ["RUNNER_TEMP"]) / "idlix-release.jks"
          keystore.write_bytes(base64.b64decode(data["keystore_b64"], validate=True))
          keystore.chmod(0o600)
          key_info=subprocess.check_output([
              "keytool", "-list", "-v", "-keystore", str(keystore),
              "-alias", alias, "-storepass", password
          ], text=True, stderr=subprocess.STDOUT)
          match=re.search(r"(?m)^\s*SHA256:\s*([0-9A-Fa-f:]+)\s*$", key_info)
          if not match:
              raise SystemExit("Could not read the release signing certificate fingerprint")
          fingerprint=re.sub(r"[^0-9A-Fa-f]", "", match.group(1)).upper()
          if not re.fullmatch(r"[0-9A-F]{64}", fingerprint):
              raise SystemExit("Invalid release signing certificate fingerprint")
          sdk=os.environ.get("ANDROID_HOME", os.environ.get("ANDROID_SDK_ROOT", ""))
          with open("local.properties", "w") as props:
              if sdk:
                  props.write("sdk.dir=" + sdk + "\n")
              props.write("storeFile=" + str(keystore) + "\n")
              props.write("storePassword=" + password + "\n")
              props.write("keyAlias=" + alias + "\n")
              props.write("keyPassword=" + password + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as result:
              result.write("enabled=true\n")
              result.write(f"certificate_sha256={fingerprint}\n")
          print("Persistent signing certificate validated; release enabled.")
          PY

      - name: Assemble signed release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify release signature and package
        id: verify
        env:
          EXPECTED_SIGNER_SHA256: ${{ steps.signing.outputs.certificate_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$OUTPUT"
          SIGNER_LINE="$(grep -E 'certificate SHA-256 digest:' <<< "$OUTPUT" | head -n1 || true)"
          SIGNER="$(sed -E 's/^.*certificate SHA-256 digest:[[:space:]]*//' <<< "$SIGNER_LINE" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(tr -d '[:space:]:' <<< "$EXPECTED_SIGNER_SHA256" | tr '[:lower:]' '[:upper:]')"
          echo "Expected release certificate SHA-256: $EXPECTED"
          echo "APK release certificate SHA-256: $SIGNER"
          if [[ ! "$EXPECTED" =~ ^[0-9A-F]{64}$ || "$SIGNER" != "$EXPECTED" ]]; then
            echo "::error::APK certificate does not match IDLIX_SIGNING_BUNDLE"
            exit 1
          fi
          BADGING="$("$AAPT" dump badging "$APK")"
          EXPECTED_PACKAGE="package: name='com.idlix.tv' versionCode='$IDLIX_VERSION_CODE' versionName='$IDLIX_RELEASE_VERSION'"
          if ! grep -Fq "$EXPECTED_PACKAGE" <<< "$BADGING"; then
            echo "::error::APK package or version is incorrect"
            exit 1
          fi
          APK_SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "Signed APK verified: $EXPECTED_PACKAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_SHA: ${{ github.sha }}
          APK_SHA256: ${{ steps.verify.outputs.apk_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          TITLE="IDLIX $RELEASE_VERSION"
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$RELEASE_SHA" \
            --jq '.body' > release-notes.md
          {
            echo
            echo "### APK"
            echo "- File: `IDLIX-$RELEASE_VERSION.apk`"
            echo "- SHA-256: `$APK_SHA256`"
            echo "- Package: `com.idlix.tv`"
            echo
            echo "Install this signed APK over your existing IDLIX app to keep local data."
            echo "<!-- IDLIX_VERSION_CODE=$RELEASE_VERSION_CODE -->"
          } >> release-notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.notes.outputs.tag }}
          RELEASE_TITLE: ${{ steps.notes.outputs.title }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME="IDLIX-$RELEASE_VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" --notes-file release-notes.md --latest
            gh release upload "$RELEASE_TAG" "$APK_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" \
              --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" \
              --title "$RELEASE_TITLE" --notes-file release-notes.md --latest
          fi
          echo "Published $RELEASE_TAG from $RELEASE_SHA." >> "$GITHUB_STEP_SUMMARY"
