name: IDLIX · Android QA / Release

on:
  # Code and Gradle changes pushed to main by ChatGPT or another client build automatically.
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idlix-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build aplikasi Android HP dan TV
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.1

      - name: Determine next public release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [[ ! "${PREVIOUS_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PREVIOUS_TAG="$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed -n 's|.*refs/tags/||p' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          fi
          if [[ "${PREVIOUS_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((10#${BASH_REMATCH[3]} + 1))"
          elif [[ -z "${PREVIOUS_TAG}" ]]; then
            VERSION="1.0.0"
          else
            echo "::error::Could not determine the latest IDLIX release version."
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION}"
          if (( MAJOR > 19 || MINOR > 99 || PATCH > 999 )); then
            echo "::error::Version outside supported range"
            exit 1
          fi
          # Keep version codes unique and monotonic within this repository.
          VERSION_CODE=$((1200000 + GITHUB_RUN_NUMBER * 1000 + 10#$PATCH))
          echo "IDLIX_VERSION_CODE=${VERSION_CODE}" >> "${GITHUB_ENV}"
          echo "IDLIX_RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "name=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Preparing IDLIX ${VERSION} (versionCode ${VERSION_CODE})" >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Validate Android launcher and splash resources
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          root = pathlib.Path("app/src/main")
          ns = "{http://schemas.android.com/apk/res/android}"
          manifest = ET.parse(root / "AndroidManifest.xml").getroot()
          application = manifest.find("application")
          activity = application.find("activity")
          assert application.get(ns + "icon") == "@mipmap/ic_idlix_full"
          assert application.get(ns + "roundIcon") == "@mipmap/ic_idlix_full_round"
          assert application.get(ns + "banner") == "@drawable/ic_banner"
          assert activity.get(ns + "theme") == "@style/Theme.IdlixTV.Starting"
          for name in ["ic_idlix_full.xml", "ic_idlix_full_round.xml"]:
              for version in ("v26", "v33"):
                  file = root / f"res/mipmap-anydpi-{version}" / name
                  icon = ET.parse(file).getroot()
                  assert icon.tag == "adaptive-icon"
                  assert icon.find("foreground").get(ns + "drawable") == "@drawable/idlix_launcher_fg"
                  assert icon.find("background").get(ns + "drawable") == "@color/idlix_launcher_bg"
                  if version == "v33":
                      assert icon.find("monochrome") is not None
          import struct, zlib, math
          def png_logo_box(path):
              data=path.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", path
              pos=8
              chunks={}
              while pos+12<=len(data):
                  size=int.from_bytes(data[pos:pos+4], "big")
                  name=data[pos+4:pos+8]
                  chunks.setdefault(name, []).append(data[pos+8:pos+8+size])
                  pos+=12+size
                  if name==b"IEND":break
              width,height,depth,channels,_,_,interlace=struct.unpack(">IIBBBBB",chunks[b"IHDR"][0])
              assert depth==8 and channels==6 and interlace==0
              raw=zlib.decompress(b"".join(chunks[b"IDAT"]))
              stride=width*4+1
              assert len(raw)==stride*height
              assert all(raw[y*stride]==0 for y in range(height))
              box=[width,height,-1,-1]
              for y in range(height):
                  row=raw[y*stride+1:(y+1)*stride]
                  for x in range(width):
                      if row[x*4+3]>10:
                          box=[min(box[0],x),min(box[1],y),
                               max(box[2],x),max(box[3],y)]
              return width,height,box
          icon=root/"res/drawable-nodpi/idlix_launcher_fg.png"
          splash=root/"res/drawable-nodpi/idlix_splash_fg.png"
          monochrome=root/"res/drawable-nodpi/idlix_launcher_monochrome.png"
          for file,size,diameter in [(icon,432,66),(monochrome,432,66),
                                      (splash,864,192)]:
              w,h,box=png_logo_box(file)
              assert (w,h)==(size,size)
              assert box[2]>=box[0] and box[3]>=box[1]
              radius=size*(diameter/(108 if size==432 else 288))/2
              corners=[(box[0],box[1]),(box[0],box[3]),
                       (box[2],box[1]),(box[2],box[3])]
              assert all(math.hypot(x-size/2,y-size/2)<radius-3
                         for x,y in corners), (str(file),box,radius)
              print(f"{file.name}: {w}x{h}, logo bounds={box}, safe radius={radius:.0f}")
          assert (root/"res/drawable/idlix_logo.png").stat().st_size>0
          styles = ET.parse(root / "res/values/themes.xml").getroot()
          starting = next(e for e in styles.findall("style") if e.get("name") == "Theme.IdlixTV.Starting")
          items = {e.get("name"): e.text for e in starting.findall("item")}
          assert starting.get("parent") == "Theme.SplashScreen"
          assert items["windowSplashScreenAnimatedIcon"] == "@drawable/idlix_splash_fg"
          assert items["postSplashScreenTheme"] == "@style/Theme.IdlixTV"
          assert "installSplashScreen()" in (root / "java/com/idlix/tv/MainActivity.kt").read_text()
          assert "android.permission.REQUEST_INSTALL_PACKAGES" in ET.tostring(manifest, encoding="unicode")
          assert any(n.get(ns + "authorities")=="${applicationId}.updates"
                     for n in application.findall("provider"))
          assert (root/"res/xml/update_paths.xml").exists()
          print("Raster-safe full IDLIX icon, splash and secure update provider: PASS")
          PY

      - name: Validate Kotlin, run unit tests, and compile Android app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      # Debug compilation is an internal QA check, never a production GitHub Release.
      # Only a persisted private keystore makes future in-place updates possible.
      # Create the ONE GitHub Actions secret IDLIX_SIGNING_BUNDLE before publishing.
      # Its JSON contains alias, password, and keystore_b64, all base64 encoded.
      - name: Restore persistent release signing key
        id: signing
        env:
          IDLIX_SIGNING_BUNDLE: ${{ secrets.IDLIX_SIGNING_BUNDLE }}
        shell: bash
        run: |
          if [[ -z "${IDLIX_SIGNING_BUNDLE}" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Release APK skipped: configure repository secret IDLIX_SIGNING_BUNDLE first. Debug APK is build validation only."
            exit 0
          fi
          python3 - <<'PY'
          import base64, json, os, pathlib, re, subprocess
          data=json.loads(base64.b64decode(os.environ["IDLIX_SIGNING_BUNDLE"].strip(), validate=True))
          alias=data["alias"]
          password=data["password"]
          if alias != "idlix" or not re.fullmatch(r"[A-Za-z0-9_-]{32,}", password):
              raise SystemExit("Unexpected signing metadata")
          keystore=pathlib.Path(os.environ["RUNNER_TEMP"]) / "idlix-release.jks"
          keystore.write_bytes(base64.b64decode(data["keystore_b64"], validate=True))
          keystore.chmod(0o600)
          key_info=subprocess.check_output([
              "keytool", "-list", "-v", "-keystore", str(keystore),
              "-alias", alias, "-storepass", password
          ], text=True, stderr=subprocess.STDOUT)
          match=re.search(r"(?m)^\s*SHA256:\s*([0-9A-Fa-f:]+)\s*$", key_info)
          if not match:
              raise SystemExit("Could not read the release signing certificate fingerprint")
          fingerprint=re.sub(r"[^0-9A-Fa-f]", "", match.group(1)).upper()
          if not re.fullmatch(r"[0-9A-F]{64}", fingerprint):
              raise SystemExit("Invalid release signing certificate fingerprint")
          sdk=os.environ.get("ANDROID_HOME", os.environ.get("ANDROID_SDK_ROOT", ""))
          with open("local.properties", "w") as props:
              if sdk:
                  props.write("sdk.dir=" + sdk + "\n")
              props.write("storeFile=" + str(keystore) + "\n")
              props.write("storePassword=" + password + "\n")
              props.write("keyAlias=" + alias + "\n")
              props.write("keyPassword=" + password + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as result:
              result.write("enabled=true\n")
              result.write(f"certificate_sha256={fingerprint}\n")
          print("Persistent signing certificate validated; release enabled.")
          PY

      - name: Upload test-only debug artifact if release key is missing
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: IDLIX-QA-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Assemble installable signed release APK
        if: steps.signing.outputs.enabled == 'true'
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify release package and signature
        if: steps.signing.outputs.enabled == 'true'
        env:
          EXPECTED_SIGNER_SHA256: ${{ steps.signing.outputs.certificate_sha256 }}
        shell: bash
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          if [[ ! -x "${APKSIGNER}" ]]; then
            APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)"
          fi
          OUTPUT=$("${APKSIGNER}" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk)
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "${OUTPUT}"
          SIGNER=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "${OUTPUT}" | tr '[:lower:]' '[:upper:]')
          EXPECTED="${EXPECTED_SIGNER_SHA256^^}"
          if [[ ! "${EXPECTED}" =~ ^[0-9A-F]{64}$ || "${SIGNER}" != "${EXPECTED}" ]]; then
            echo "::error::Signed APK certificate does not match IDLIX_SIGNING_BUNDLE"
            exit 1
          fi
          # Confirm the packaged manifest actually matches the new independent release.
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          if [[ ! -x "${AAPT}" ]]; then
            AAPT="$(find "${ANDROID_HOME}/build-tools" -name aapt -type f | sort -V | tail -1)"
          fi
          BADGING="$("${AAPT}" dump badging app/build/outputs/apk/release/app-release.apk)"
          grep -Eq "^package: name='com\\.idlix\\.tv' versionCode='${IDLIX_VERSION_CODE}' versionName='${IDLIX_RELEASE_VERSION}'" <<< "${BADGING}" || {
            echo "::error::APK package/version differs from the intended release, refusing to publish"
            exit 1
          }
          APK_SHA256="$(sha256sum app/build/outputs/apk/release/app-release.apk | cut -d' ' -f1)"
          cat > app/build/outputs/apk/release/release-info.env <<EOF
          IDLIX_RELEASE_VERSION=${IDLIX_RELEASE_VERSION}
          IDLIX_VERSION_CODE=${IDLIX_VERSION_CODE}
          IDLIX_HEAD_SHA=${GITHUB_SHA}
          APK_SHA256=${APK_SHA256}
          EOF
          echo "Signed APK verified (signature, package and manifest version). Package: com.idlix.tv, versionCode: ${IDLIX_VERSION_CODE}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload signed update APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: IDLIX-${{ steps.version.outputs.name }}-signed-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/release-info.env
          retention-days: 30
          if-no-files-found: error
